# Compose may replace or scale backend containers after Nginx starts. Periodic
# DNS refresh prevents a stale container IP from remaining pinned in Nginx.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream backend_servers {
    zone backend_servers 64k;
    server backend:8081 resolve;
}

server {
    listen 80;
    charset utf-8;
    server_name localhost;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index pharmacy.html index.html;

    location = /swagger-ui.html {
        proxy_set_header Host $host;
        proxy_pass http://backend_servers;
    }
    # The bare directory path /swagger-ui/ is not matched by the backend
    # login interceptor's PathPattern exclusions (only its subpaths are),
    # so it would return 401. Serve the UI page directly (200, no
    # redirect): a `return 302` builds an absolute Location with this
    # server's listen port (80), which breaks stacks published on
    # another port (e.g. the 18080 verify stack) when curl follows it.
    location = /swagger-ui/ {
        rewrite ^ /swagger-ui/index.html break;
        proxy_set_header Host $host;
        proxy_pass http://backend_servers;
    }
    location ^~ /swagger-ui/ {
        proxy_set_header Host $host;
        proxy_pass http://backend_servers;
    }
    location ^~ /v3/api-docs/ {
        proxy_set_header Host $host;
        proxy_pass http://backend_servers;
    }
    location = /v3/api-docs {
        proxy_set_header Host $host;
        proxy_pass http://backend_servers;
    }

    # Pharmacy v1 routes already include /api; keep the prefix for those routes.
    location /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_servers;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_servers/;
    }

    # Keep login-code, login, and authenticated profile requests on the backend
    # even when the static-asset regexes change. These endpoints are also used
    # by the isolated smoke and cache-verification stacks.
    location ^~ /user/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_servers;
    }

    # Legacy controllers keep their original URL prefixes and still need to
    # reach Spring Boot instead of the static-site fallback.
    location ~ ^/(shop|shop-type|voucher|voucher-order|reservation|upload|follow|blog|blog-comments|chat|ai)(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_servers;
    }

    location /ws-chat {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_pass http://backend_servers/ws-chat;
    }

    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
