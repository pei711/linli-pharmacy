# Isolated, temporary test stack; access via SSH tunnel only.
# Per-container hard caps currently total 1,392 MiB. The aggregate budget is
# 1,600 MiB; host use is gated separately at 1,898 MiB by memory-preflight.sh.
services:
  mysql:
    image: mysql:8.4
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    command: ["--innodb-buffer-pool-size=64M", "--max-connections=30", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: hmdp
      MYSQL_USER: hmdp
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.3
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    environment:
      KAFKA_HEAP_OPTS: "-Xms96m -Xmx192m"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "33554432"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:MaxDirectMemorySize=96m -XX:MaxMetaspaceSize=128m"
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server-test
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:MaxMetaspaceSize=160m"
      DB_URL: jdbc:mysql://mysql:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: hmdp
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:8090}
      AI_API_KEY: ${AI_API_KEY:-demo-key}
      MCP_API_TOKEN: ""
      APP_AUTH_EXPOSE_CODE: "true"
      PHARMACY_FLYWAY_ENABLED: "true"
      PHARMACY_SECKILL_ENABLED: "true"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
  frontend:
    image: nginx:1.27-alpine
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.25
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./AI-dianping-frontend/html/hmdp:/usr/share/nginx/html:ro
      - ./AI-dianping-frontend/conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    # `up --wait` otherwise considers this stack ready as soon as Nginx starts,
    # even though Spring may still be booting and Nginx returns 502 for API calls.
    # Probe through Nginx so the check covers both proxy routing and backend readiness.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/v3/api-docs | grep -q '\"paths\"'"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 60s
volumes:
  mysql_data:
  redis_data:
  kafka_data:
